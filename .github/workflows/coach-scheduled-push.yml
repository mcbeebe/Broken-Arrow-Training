name: Coach Scheduled Push

# BACKSTOP ONLY — the Vercel cron in vercel.json is the primary schedule now.
#
# This workflow used to BE the schedule: the Vercel cron ran hourly
# (`0 * * * *`), which fails to deploy on the HOBBY plan (Hobby caps crons at
# once/day), and the fan-out must run every hour to catch each device's LOCAL
# morning/afternoon/evening. The project is on PRO now, so the hourly cron is
# back in vercel.json and this is demoted to a safety net while we confirm the
# cron actually fires. Delete this file once it has.
#
# IT RUNS AT :30, NOT :00, AND THAT IS LOAD-BEARING. The dedup is a
# check-then-set on coach_push_sent:* — read the key, send, write the key —
# which is NOT atomic. Two schedulers firing at the same instant can both read
# the key as absent and both send, so an athlete gets the same briefing twice.
# Offset by half an hour there is no race: if the Vercel cron fired at :00 the
# key is already set and this run is a no-op, and if it did NOT fire, this run
# still lands inside the same local hour and delivers the nudge.
#
# GitHub Actions schedules are best-effort and can lag ~5-15 min under load,
# which is fine for a backstop (and is itself a reason the Vercel cron is the
# better primary).
#
# Secrets used:
#   VITE_GARMIN_API_URL  — API base (already configured for the frontend build)
#   CRON_SECRET          — must match the Vercel env var of the same name; the
#                          endpoint requires `Authorization: Bearer <CRON_SECRET>`
#                          when set, and is open when unset.
on:
  schedule:
    - cron: '30 * * * *' # :30 past the hour — deliberately offset from the
                         # Vercel cron at :00; see the header note.
  workflow_dispatch: {}

concurrency:
  group: coach-scheduled-push
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hourly briefing fan-out
        env:
          API_URL: ${{ secrets.VITE_GARMIN_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::VITE_GARMIN_API_URL secret is not set — cannot reach the API."
            exit 1
          fi
          echo "Pinging ${API_URL%/}/api/coach/scheduled_push"
          curl -fsS --max-time 60 -X GET "${API_URL%/}/api/coach/scheduled_push" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: gha-coach-scheduled-push"
