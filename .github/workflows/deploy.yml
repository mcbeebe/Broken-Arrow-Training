name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/*']
  workflow_dispatch:

permissions:
  contents: write

# Per-branch concurrency lane. A push to a feature branch shouldn't
# cancel a deploy that's mid-flight from the default branch. Each ref
# only cancels its OWN older runs. Side branches still pay test+build
# cost so we catch breakage before merge, but only the default branch
# (or a manual dispatch) actually publishes to gh-pages — see the
# conditional on the publish step.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Default branch that ships to gh-pages. Update when the branch is
# renamed. `main` is kept for forward compatibility in case the repo
# ever migrates to it.
env:
  PUBLISH_REF: refs/heads/claude/broken-arrow-training-app-P4N1p

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  # Cutover airlock — REPLACED the legacy `build-and-deploy` job at
  # cutover. The legacy origin (mcbeebe.github.io/Broken-Arrow-Training/)
  # now serves the standalone migration airlock from scripts/airlock/.
  # When users visit any legacy URL, the airlock collects their
  # localStorage payload, transfers it to attune.coach via postMessage,
  # and forwards them with deep links preserved.
  #
  # To roll back: git-revert this commit (restores the previous
  # build-and-deploy job, which rebuilds the regular app to gh-pages).
  cutover-airlock:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ./airlock-dist
          cp scripts/airlock/index.html ./airlock-dist/index.html
          cp scripts/airlock/404.html ./airlock-dist/404.html
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == env.PUBLISH_REF || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./airlock-dist
          # Orphan the gh-pages history so the legacy app's old commits
          # don't pile up; the airlock is the only thing this branch
          # should ever serve from here on.
          force_orphan: true

  # Parallel build for the attune.coach custom domain. Always runs to
  # catch breakage on PR/branch pushes, but only PUBLISHES when the
  # repo variable ATTUNE_PUBLISH_ENABLED is 'true' AND the deploy
  # token secret is set. The publish target is a separate repo
  # (mcbeebe/attune-coach) so the legacy GH Pages site keeps serving
  # under its current URL during the cutover window. See
  # /root/.claude/plans/please-give-me-step-delightful-micali.md
  # for the cutover sequence.
  build-and-deploy-attune:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Apex domain — no subpath.
          VITE_BASE_PATH: /
          VITE_STRAVA_CLIENT_ID: ${{ secrets.VITE_STRAVA_CLIENT_ID }}
          VITE_STRAVA_TOKEN_EXCHANGE_URL: ${{ secrets.VITE_STRAVA_TOKEN_EXCHANGE_URL }}
          VITE_STRAVA_REDIRECT_URI: https://attune.coach/
          VITE_GARMIN_API_URL: ${{ secrets.VITE_GARMIN_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
          # Migration receiver's origin allowlist — accept postMessage
          # bridges from the legacy GH Pages origin only.
          VITE_SOURCE_ORIGIN: https://mcbeebe.github.io
      # Inject CNAME file so GitHub Pages keeps the custom domain set.
      # Must NOT live in public/ — it'd land in the legacy build too.
      - run: echo "attune.coach" > ./dist/CNAME
      # Stamp the published build's commit SHA so the running app can ask
      # "is the bundle I'm executing the one GH Pages is serving?" — the
      # signal Deploy Diagnostics uses to tell a stale browser apart from
      # a stale backend. Same value baked into VITE_GIT_COMMIT_SHA above.
      - run: echo '{"commit":"${{ github.sha }}"}' > ./dist/version.json
      - uses: peaceiris/actions-gh-pages@v4
        if: >-
          vars.ATTUNE_PUBLISH_ENABLED == 'true' &&
          (github.ref == env.PUBLISH_REF || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        with:
          personal_token: ${{ secrets.ATTUNE_DEPLOY_TOKEN }}
          external_repository: mcbeebe/attune-coach
          publish_branch: gh-pages
          publish_dir: ./dist
