name: Deploy to GitHub Pages

# Push fires only on the branches that can actually publish; every other
# branch is covered by `pull_request`. That split does two things: it stops
# a branch push and its PR from both running the same suite, and — the
# reason it matters — it guarantees the `test` check EXISTS on every pull
# request. A required status check that never runs blocks its PR forever,
# so this has to be in place before branch protection is turned on.
# Publishing is unaffected: on a PR event github.ref is refs/pull/N/merge,
# which matches neither publish condition below.
on:
  push:
    branches: [main, 'claude/broken-arrow-training-app-P4N1p']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Per-branch concurrency lane. A push to a feature branch shouldn't
# cancel a deploy that's mid-flight from the default branch. Each ref
# only cancels its OWN older runs. Side branches still pay test+build
# cost so we catch breakage before merge, but only the default branch
# (or a manual dispatch) actually publishes to gh-pages — see the
# conditional on the publish step.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Default branch that ships to gh-pages. Update when the branch is
# renamed. `main` is kept for forward compatibility in case the repo
# ever migrates to it.
env:
  PUBLISH_REF: refs/heads/claude/broken-arrow-training-app-P4N1p

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # NOTE: `npm run lint` is deliberately NOT here yet. eslint currently
      # reports 43 errors (see docs/initiatives/002-eslint-to-green/), so
      # wiring it in today would make this required check red on arrival.
      # It goes in as a blocking step in the same PR that reaches zero.
      - run: npm test

  # Cutover airlock — REPLACED the legacy `build-and-deploy` job at
  # cutover. The legacy origin (mcbeebe.github.io/Broken-Arrow-Training/)
  # now serves the standalone migration airlock from scripts/airlock/.
  # When users visit any legacy URL, the airlock collects their
  # localStorage payload, transfers it to attune.coach via postMessage,
  # and forwards them with deep links preserved.
  #
  # To roll back: git-revert this commit (restores the previous
  # build-and-deploy job, which rebuilds the regular app to gh-pages).
  cutover-airlock:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ./airlock-dist
          cp scripts/airlock/index.html ./airlock-dist/index.html
          cp scripts/airlock/404.html ./airlock-dist/404.html
      # A manual dispatch FROM a publishing branch still publishes, because
      # github.ref is that branch. Dispatching from a feature branch no
      # longer can — which it could while `workflow_dispatch` was its own
      # disjunct here, making one click enough to ship any branch live.
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == env.PUBLISH_REF || github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./airlock-dist
          # Orphan the gh-pages history so the legacy app's old commits
          # don't pile up; the airlock is the only thing this branch
          # should ever serve from here on.
          force_orphan: true

  # Parallel build for the attune.coach custom domain. Always runs to
  # catch breakage on PR/branch pushes, but only PUBLISHES when the
  # repo variable ATTUNE_PUBLISH_ENABLED is 'true' AND the deploy
  # token secret is set. The publish target is a separate repo
  # (mcbeebe/attune-coach) so the legacy GH Pages site keeps serving
  # under its current URL during the cutover window.
  #
  # Cutover sequence (this comment previously cited a Claude session plan
  # file outside the repo, which no longer exists — recorded here instead):
  #   1. This job builds with VITE_BASE_PATH=/ and publishes dist/ to
  #      mcbeebe/attune-coach gh-pages, which serves the apex domain via
  #      the injected CNAME.
  #   2. The cutover-airlock job above force-orphans THIS repo's gh-pages
  #      so the legacy origin (mcbeebe.github.io/Broken-Arrow-Training/)
  #      serves only scripts/airlock/.
  #   3. A user landing on any legacy URL hits the airlock, which reads
  #      their localStorage, postMessages it to attune.coach (allowlisted
  #      via VITE_SOURCE_ORIGIN), and forwards them with the deep link
  #      preserved — see scripts/airlock/index.html, which strips the
  #      /Broken-Arrow-Training/ path prefix. Renaming this repo breaks
  #      that strip and with it the migration path.
  #   4. Rollback: git-revert the cutover commit to restore the previous
  #      build-and-deploy job, or set ATTUNE_PUBLISH_ENABLED to pause.
  build-and-deploy-attune:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Apex domain — no subpath.
          VITE_BASE_PATH: /
          VITE_STRAVA_CLIENT_ID: ${{ secrets.VITE_STRAVA_CLIENT_ID }}
          VITE_STRAVA_TOKEN_EXCHANGE_URL: ${{ secrets.VITE_STRAVA_TOKEN_EXCHANGE_URL }}
          VITE_STRAVA_REDIRECT_URI: https://attune.coach/
          VITE_GARMIN_API_URL: ${{ secrets.VITE_GARMIN_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
          # Migration receiver's origin allowlist — accept postMessage
          # bridges from the legacy GH Pages origin only.
          VITE_SOURCE_ORIGIN: https://mcbeebe.github.io
      # Inject CNAME file so GitHub Pages keeps the custom domain set.
      # Must NOT live in public/ — it'd land in the legacy build too.
      - run: echo "attune.coach" > ./dist/CNAME
      # Stamp the published build's commit SHA so the running app can ask
      # "is the bundle I'm executing the one GH Pages is serving?" — the
      # signal Deploy Diagnostics uses to tell a stale browser apart from
      # a stale backend. Same value baked into VITE_GIT_COMMIT_SHA above.
      - run: echo '{"commit":"${{ github.sha }}"}' > ./dist/version.json
      - uses: peaceiris/actions-gh-pages@v4
        # Same fix as the airlock job above: a dispatch from a publishing
        # branch is covered by the ref test, so the separate
        # `workflow_dispatch` disjunct only ever widened this to "any
        # branch, one click". NOTE for the future trunk migration: keep
        # BOTH ref arms — dropping the `main` arm here silently disables
        # publishing the moment the default branch is renamed, and it
        # fails as a skipped step inside a green workflow.
        if: >-
          vars.ATTUNE_PUBLISH_ENABLED == 'true' &&
          (github.ref == env.PUBLISH_REF || github.ref == 'refs/heads/main')
        with:
          personal_token: ${{ secrets.ATTUNE_DEPLOY_TOKEN }}
          external_repository: mcbeebe/attune-coach
          publish_branch: gh-pages
          publish_dir: ./dist
          # Keep previous deploys' hashed bundles alive. Without this,
          # every publish wipes the branch, so any browser holding a
          # cached index.html points at assets that no longer exist and
          # renders a blank page until its HTML cache expires (the field
          # P0 after a run of rapid successive deploys). Content-hashed
          # filenames make the leftovers harmless; index.html, CNAME and
          # version.json are still overwritten each deploy.
          keep_files: true
