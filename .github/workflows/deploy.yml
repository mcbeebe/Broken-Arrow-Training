name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/*']
  workflow_dispatch:

permissions:
  contents: write

# Per-branch concurrency lane. A push to a feature branch shouldn't
# cancel a deploy that's mid-flight from the default branch. Each ref
# only cancels its OWN older runs. Side branches still pay test+build
# cost so we catch breakage before merge, but only the default branch
# (or a manual dispatch) actually publishes to gh-pages — see the
# conditional on the publish step.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Default branch that ships to gh-pages. Update when the branch is
# renamed. `main` is kept for forward compatibility in case the repo
# ever migrates to it.
env:
  PUBLISH_REF: refs/heads/claude/broken-arrow-training-app-P4N1p

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_STRAVA_CLIENT_ID: ${{ secrets.VITE_STRAVA_CLIENT_ID }}
          VITE_STRAVA_TOKEN_EXCHANGE_URL: ${{ secrets.VITE_STRAVA_TOKEN_EXCHANGE_URL }}
          VITE_STRAVA_REDIRECT_URI: https://mcbeebe.github.io/Broken-Arrow-Training/
          VITE_GARMIN_API_URL: ${{ secrets.VITE_GARMIN_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # VAPID public key for Web Push (coach briefings). Must be
          # baked in at build time — the Settings → Notifications panel
          # gates the Enable button on its presence. Pair with the
          # server-side VAPID_PRIVATE_KEY / VAPID_SUBJECT on Vercel.
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          # Git SHA baked into the bundle so the Deploy Diagnostics
          # panel in Settings can compare frontend vs. API version.
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
      # Only the default branch (or a manual workflow_dispatch trigger)
      # actually publishes to gh-pages. This prevents a feature
      # branch's bundle from clobbering the production deploy — the
      # exact failure mode that buried PR #92's home-location code
      # under PR #93's side-branch pushes.
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == env.PUBLISH_REF || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
