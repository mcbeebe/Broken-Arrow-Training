name: Bake course terrain

# Manual-only workflow that bakes a heightmap JSON for a course and
# opens a PR. Exists because the web sandbox blocks every elevation
# API (Open-Elevation, USGS 3DEP, OpenTopoData all return 403 from
# Claude's environment); GitHub-hosted runners have unrestricted
# outbound network, so the fetch runs cleanly here.
#
# Trigger this from the GitHub UI (Actions → Bake course terrain →
# Run workflow) or the mobile app. The default inputs bake Broken
# Arrow 18K with a 96×96 grid (~90s of paced fetching).

on:
  workflow_dispatch:
    inputs:
      courseId:
        description: 'Course id (must match src/data/courses/<id>.ts)'
        required: true
        default: 'broken-arrow-18k-2026'
      grid:
        description: 'Grid samples per side (16–256)'
        required: false
        default: '96'
      bbox:
        description: 'Override bounding box "minLat,minLon,maxLat,maxLon" (optional)'
        required: false
        default: ''
      source:
        description: 'Elevation dataset'
        required: false
        default: 'opentopodata'
        type: choice
        options:
          - opentopodata
          - open-elevation

permissions:
  contents: write
  pull-requests: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Bake heightmap
        env:
          COURSE_ID: ${{ inputs.courseId }}
          GRID: ${{ inputs.grid }}
          BBOX: ${{ inputs.bbox }}
          SOURCE: ${{ inputs.source }}
        run: |
          ARGS="--course $COURSE_ID --grid $GRID --source $SOURCE"
          if [ -n "$BBOX" ]; then
            ARGS="$ARGS --bbox $BBOX"
          fi
          echo "Running: npm run fetch:terrain -- $ARGS"
          npm run fetch:terrain -- $ARGS

      - name: Show baked file
        run: |
          ls -lh src/data/terrain/
          echo "---"
          head -c 400 src/data/terrain/${{ inputs.courseId }}.json
          echo

      - name: Open PR with baked terrain
        uses: peter-evans/create-pull-request@v7
        with:
          branch: terrain/bake-${{ inputs.courseId }}
          base: ${{ github.ref_name }}
          commit-message: |
            Bake ${{ inputs.courseId }} terrain heightmap

            ${{ inputs.grid }}×${{ inputs.grid }} grid from ${{ inputs.source }},
            generated by .github/workflows/bake-terrain.yml run
            ${{ github.run_id }}.
          title: 'Bake ${{ inputs.courseId }} terrain heightmap'
          body: |
            Auto-generated by the **Bake course terrain** workflow
            (run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            - Course: `${{ inputs.courseId }}`
            - Grid: `${{ inputs.grid }}×${{ inputs.grid }}`
            - Source: `${{ inputs.source }}`
            - Bbox: `${{ inputs.bbox || 'auto (±2.5 km around course center)' }}`

            Merging this PR makes the "See your course" CTA on the
            "Your race" card go live for runners with this course
            selected. No code changes — the 3D renderer auto-detects
            the new JSON via `import.meta.glob`.
          add-paths: |
            src/data/terrain/${{ inputs.courseId }}.json
          delete-branch: true
