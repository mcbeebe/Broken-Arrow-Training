name: Coach Eval

# Behavioral eval harness for the Coach LLM (R1). Deliberately a SEPARATE
# workflow from deploy.yml so it can never gate or interfere with the deploy
# pipeline. Two jobs:
#   - coach-unit: keyless (fixture-honesty + assertion unit tests), runs on
#     every PR, on pushes to a publishing branch, + manual dispatch.
#     Catches harness/fixture breakage cheaply.
#   - coach-eval: LIVE model calls (real ANTHROPIC_API_KEY, costs budget).
#     Opt-in only — manual dispatch, or a PR labeled `run-coach-eval`.
#
# The `push` trigger is what makes the keyless suite cover the revision
# Vercel actually deploys. PR runs test the pre-merge head; the squash
# commit that lands on the publishing branch is a DIFFERENT sha, and that
# is the one Vercel builds the API from. Without this, api/ shipped on a
# commit no Python test had ever executed against.
#
# This does not walk back the separation above: the suite still lives here,
# still cannot gate or cancel deploy.yml, and pytest.ini's `-m "not eval"`
# default still means no push ever spends API budget.
on:
  push:
    branches: [main, 'claude/broken-arrow-training-app-P4N1p']
  pull_request:
  workflow_dispatch:

jobs:
  coach-unit:
    name: Coach harness — fixture honesty + assertions (keyless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r api/requirements-dev.txt
      - name: Run keyless coach tests
        run: pytest -m "not eval" api/coach/tests -v

  coach-eval:
    name: Coach report-card — live model evals (opt-in)
    # Manual dispatch, or a PR explicitly labeled `run-coach-eval`. Never
    # runs on a plain push/PR, so it never spends API budget by accident.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-coach-eval'))
    runs-on: ubuntu-latest
    # A flaky live-model assertion should be visible, not block the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r api/requirements-dev.txt
      - name: Run live Coach report-card evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest -m eval api/coach/tests/eval -v
