[pytest]
# Coach behavioral eval harness (R1). The default run EXCLUDES the live
# model evals (`-m "not eval"`) so a stray `pytest` never spends API budget;
# it runs only the keyless fixture-honesty + assertion unit tests.
#
# Live report-card evals (real model calls): `pytest -m eval api/coach/tests/eval`
# (also wired as `npm run test:coach-eval`). The trailing `-m eval` overrides
# the default markexpr below.
testpaths = api/coach/tests
python_files = test_*.py
markers =
    eval: live-model Coach report-card evals (opt-in, needs ANTHROPIC_API_KEY)
addopts = -m "not eval"
