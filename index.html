<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Light or dark follows the device; the header switch overrides it (src/landing/theme.ts). -->
    <meta name="color-scheme" content="light dark" />
    <script data-root-fallback>
      // Installed home-screen apps, notification taps and Strava callbacks
      // all open here first. If the guard module (src/landing/main.tsx)
      // never runs — a chunk failed on a flaky connection — forward to the
      // app rather than leave a blank page. The guard sets the flag below.
      ;(function () {
        function rescue() {
          if (window.__attuneGuardRan) return
          window.__attuneGuardRan = true
          location.replace('/app/' + location.search + location.hash)
        }
        window.addEventListener('error', function (e) {
          var t = e.target
          var tag = t && t.tagName
          if ((tag === 'SCRIPT' || tag === 'LINK') && !e.message) rescue()
        }, true)
        setTimeout(rescue, 8000)
      })()
    </script>
    <!-- After the fallback, so nothing here can delay the rescue path. Applies a saved
         pick before first paint, and paints the ground before the page's CSS arrives. -->
    <script data-theme-pick>
      ;(function () {
        try {
          var t = localStorage.getItem('attune.landing.theme')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
    <style data-theme-ground>
      :root { color-scheme: only light; background: #F3F6F4; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { color-scheme: dark; background: #0E1614; } }
      :root[data-theme='dark'] { color-scheme: dark; background: #0E1614; }
    </style>
    <!-- The landing mark; /favicon.svg is the app's icon (manifest, push) and stays untouched. -->
    <link rel="icon" type="image/svg+xml" href="/attune-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attune: training that adapts to you</title>
    <meta name="description" content="An AI coach that reads your recovery every morning and adjusts today’s workout. Road races, trail and ultra, HYROX, and general fitness. Free during the beta." />
    <link rel="canonical" href="https://attune.coach/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Attune" />
    <meta property="og:url" content="https://attune.coach/" />
    <meta property="og:title" content="Training that actually adapts to you" />
    <meta property="og:description" content="An AI coach that reads your recovery every morning and adjusts today’s workout. Road races, trail and ultra, HYROX, and general fitness. Free during the beta." />
    <meta property="og:image" content="https://attune.coach/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Attune “This morning” card: HRV, resting heart rate and sleep, with today’s workout adjusted" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Training that actually adapts to you" />
    <meta name="twitter:description" content="An AI coach that reads your recovery every morning and adjusts today’s workout. Road races, trail and ultra, HYROX, and general fitness. Free during the beta." />
    <meta name="twitter:image" content="https://attune.coach/og-image.png" />
    <meta name="twitter:image:alt" content="The Attune “This morning” card: HRV, resting heart rate and sleep, with today’s workout adjusted" />
  </head>
  <body>
    <div id="root"></div>
    <noscript><p><a href="/app/">Open Attune</a></p></noscript>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
